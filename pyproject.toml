[tool.pytest.ini_options]
# pythonpath=. — чтобы `from bot.notifications import ...` работало без
# установки проекта как пакета (тесты лежат в tests/, код в корне).
pythonpath = ["."]
testpaths = ["tests"]
# auto — можно писать `async def test_...` без @pytest.mark.asyncio на каждом
asyncio_mode = "auto"
addopts = "-q --strict-markers"

[tool.ruff]
# 120, а не 88/100: в существующем коде две строки по 102 и 115 символов
# (bot/draftgen.py, bot/keyboards.py). Линтер, который краснеет сразу после
# подключения, быстро начинают игнорировать — поэтому лимит подогнан под код.
# Захочешь строже — поправь эти две строки и опусти сюда 100.
line-length = 120
# py312 — версия из Dockerfile, чтобы UP-правила советовали то, что реально
# доступно в проде (локальный venv сейчас на 3.10, см. README тестов).
target-version = "py312"
exclude = ["venv", "data", ".git"]

[tool.ruff.lint]
# Намеренно узкий набор: E/F/W ловят реальные ошибки, B — типичные ловушки,
# UP — устаревшие конструкции. Правило "I" (сортировка импортов) пока не
# включено: в существующем коде порядок местами не по алфавиту, включать
# стоит вместе с прогоном `ruff check --fix`.
select = ["E", "F", "W", "B", "UP"]
