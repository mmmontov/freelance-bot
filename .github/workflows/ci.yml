name: CI

on: 
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    strategy:
      # одна упавшая версия не убивает вторую — видно обе сразу
      fail-fast: false
      matrix:
        # 3.12 = Dockerfile/прод, 3.10 = локальный venv
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install deps
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Tests
        run: pytest

  docker:
    # образ должен собираться на каждом PR, иначе поломку Dockerfile
    # обнаружишь только в момент деплоя
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: freelance-bot:ci
          # слои остаются в кэше Actions: следующая сборка секунды, а не минуты
          cache-from: type=gha
          cache-to: type=gha,mode=max