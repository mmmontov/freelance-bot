name: CI

on: 
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    strategy:
      # одна упавшая версия не убивает вторую — видно обе сразу
      fail-fast: false
      matrix:
        # 3.12 = Dockerfile/прод, 3.10 = локальный venv
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install deps
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Tests
        run: pytest

  secrets-scan:
    # в репозитории лежит рабочий .env с BOT_TOKEN и ключом Groq. Он в
    # .gitignore, но одна команда `git add -f` отменяет это навсегда —
    # история публична. Ловим до merge, а не после
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks сканирует историю, а не только последний коммит
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    # образ должен собираться на каждом PR, иначе поломку Dockerfile
    # обнаружишь только в момент деплоя
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: freelance-bot:ci
          # load: образ должен оказаться в локальном докере, иначе trivy
          # ниже не найдёт что сканировать
          load: true
          # слои остаются в кэше Actions: следующая сборка секунды, а не минуты
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image
        # тег обязательно с префиксом v: после инцидента с цепочкой поставок
        # проект перевёл все теги на v-форму, и старые без префикса удалены
        # (уцелел только 0.35.0). Ссылка на несуществующий тег роняет job за 2 с
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: freelance-bot:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          # 0 = отчёт без блокировки. Меняй на 1, когда разберёшься с шумом
          # базового python:3.12-slim и решишь, что готов чинить его апдейтом
          exit-code: "0"