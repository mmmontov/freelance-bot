name: Deploy

on:
  push:
    branches: [main]
  # ручной запуск: тот же workflow умеет откатывать на любой прежний тег
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Тег образа (пусто = свежесобранный main)"
        required: false

# два деплоя одновременно = два бота на одном токене. Не отменяем, а ставим в очередь
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # sha-тег — то, на что откатываются; latest — то, что берёт compose по умолчанию
          # priority=300 поднимает sha над raw (дефолт 100 против 200), иначе
          # outputs.version вернёт "latest" и деплой перестанет быть привязан к коммиту
          tags: |
            type=sha,prefix=sha-,priority=300
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Pull & restart on server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: IMAGE_TAG
          script: |
            # set -e вместо удалённого в v1.0.0 input'а script_stop: без него
            # код возврата скрипта — это код последней команды, и упавшая
            # проверка контейнера ниже не покраснит job
            set -e
            cd /opt/freelance_bot
            cp -f data/bot.db "data/backup-$(date +%F-%H%M).db" || true
            # держим пять последних бэкапов, иначе data/ растёт на 1.6 МБ за деплой
            ls -t data/backup-*.db 2>/dev/null | tail -n +6 | xargs -r rm --
            docker compose pull
            docker compose up -d
            sleep 10
            docker inspect -f '{{.State.Running}}' freelance-bot | grep -qx true
            docker image prune -f
        env:
          IMAGE_TAG: ${{ inputs.image_tag || needs.build-push.outputs.tag }}

      - name: Tell me if it broke
        if: failure()
        run: |
          curl -sS -X POST \
            "https://api.telegram.org/bot${{ secrets.ALERT_BOT_TOKEN }}/sendMessage" \
            -d chat_id=${{ secrets.ALERT_CHAT_ID }} \
            -d text="Deploy ${{ github.sha }} упал: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"